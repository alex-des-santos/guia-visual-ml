<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f6f4ef; }
      #main { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: #f6f4ef; }
    </style>
  </head>
  <body>
    <!-- Sequência com os 7 vídeos. Cada vídeo é renderizado separado com --start/--end (ver README). -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="184" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="abertura" class="clip" data-composition-id="abertura" data-composition-src="compositions/abertura.html" data-start="0" data-duration="19" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="linear" class="clip" data-composition-id="linear" data-composition-src="compositions/linear.html" data-start="19" data-duration="23" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="logistic" class="clip" data-composition-id="logistic" data-composition-src="compositions/logistic.html" data-start="42" data-duration="23" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tree" class="clip" data-composition-id="tree" data-composition-src="compositions/tree.html" data-start="65" data-duration="23" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="kmeans" class="clip" data-composition-id="kmeans" data-composition-src="compositions/kmeans.html" data-start="88" data-duration="24" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="neural" class="clip" data-composition-id="neural" data-composition-src="compositions/neural.html" data-start="112" data-duration="24" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="forest" class="clip" data-composition-id="forest" data-composition-src="compositions/forest.html" data-start="136" data-duration="24" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="boosting" class="clip" data-composition-id="boosting" data-composition-src="compositions/boosting.html" data-start="160" data-duration="24" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
